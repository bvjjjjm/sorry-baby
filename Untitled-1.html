<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>I'm Sorry My Love</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: black;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      color: pink;
      font-family: "Brush Script MT", cursive;
    }

    #text {
      font-size: 3em;
      text-align: center;
      text-shadow: 0 0 20px red, 0 0 40px hotpink;
      z-index: 10;
      white-space: pre-line;
    }

    #buttons {
      margin-top: 40px;
      z-index: 10;
      display: none; /* hidden until typing finishes */
    }

    button {
      font-size: 1.5em;
      padding: 10px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: pink;
      color: red;
      font-family: inherit;
      box-shadow: 0 0 10px red;
      position: relative;
    }

    button:hover {
      background: hotpink;
      color: white;
    }

    /* Asymmetrical placement */
    #yesBtn {
      margin-right: 60px;
    }
    #noBtn {
      margin-left: 80px;
    }

    .heart {
      position: absolute;
      width: 30px;
      height: 30px;
      background: red;
      transform: rotate(45deg);
      animation: floatUp 6s linear infinite;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: red;
    }

    .heart::before {
      top: -15px;
      left: 0;
    }

    .heart::after {
      left: -15px;
      top: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    #screen2 {
      display: none;
      font-size: 3em;
      text-shadow: 0 0 20px red, 0 0 40px hotpink;
      z-index: 10;
    }
  </style>
</head>
<body>
  <!-- Screen 1 -->
  <div id="screen1">
    <div id="text"></div>
    <div id="buttons">
      <button id="yesBtn">YES</button>
      <button id="noBtn">NO</button>
    </div>
  </div>

  <!-- Screen 2 -->
  <div id="screen2">YEHEY!! THANK YOU BABY ❤️</div>

  <!-- Music -->
  <audio id="music1" loop>
    <source src="love-is-gone.mp3" type="audio/mpeg">
  </audio>

  <audio id="music2" loop>
    <source src="yippe.mp3" type="audio/mpeg">
  </audio>

  <script>
    // Typing effect
    const message = "I'm Sorry My Love,\nPlease Forgive Me";
    let i = 0;
    function typeWriter() {
      if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeWriter, 100);
      } else {
        // Show buttons after typing finishes
        document.getElementById("buttons").style.display = "flex";
        document.getElementById("buttons").style.justifyContent = "center";

        // Start music after typing is done
        music1.play().catch(err => {
          console.log("Autoplay blocked until interaction:", err);
        });
      }
    }
    typeWriter();

    // Hearts
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.style.left = Math.random() * window.innerWidth + "px";
      heart.style.animationDuration = (4 + Math.random() * 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 7000);
    }
    setInterval(createHeart, 300);

    // Buttons
    const yesBtn = document.getElementById("yesBtn");
    const noBtn = document.getElementById("noBtn");
    const screen1 = document.getElementById("screen1");
    const screen2 = document.getElementById("screen2");

    const music1 = document.getElementById("music1");
    const music2 = document.getElementById("music2");

    // YES button → switch screen & music
    yesBtn.addEventListener("click", () => {
      screen1.style.display = "none";
      screen2.style.display = "block";

      music1.pause();
      music1.currentTime = 0;
      music2.play();
    });

    // NO button runs away
    noBtn.addEventListener("mouseover", () => {
      const x = Math.random() * (window.innerWidth - 100);
      const y = Math.random() * (window.innerHeight - 50);
      noBtn.style.position = "absolute";
      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    });
  </script>
</body>
</html>
